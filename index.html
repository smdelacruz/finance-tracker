<!DOCTYPE html>

<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div id="login-screen" class="min-h-screen flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition-shadow p-8">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-9 h-9 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-600">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-slate-900">Wealth<span class="text-amber-600">Tracker</span></h1>
                    <p class="text-xs text-slate-500">Private owner sign-in</p>
                </div>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="login-username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="login-username" required autocomplete="username" autocapitalize="none" spellcheck="false" class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label for="login-password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password" minlength="8" class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <p id="login-error" class="hidden text-sm text-rose-600" role="alert"></p>
                <button type="submit" class="w-full min-h-12 px-4 py-3 text-base font-semibold text-white bg-amber-500 hover:bg-amber-600 rounded-xl shadow-sm transition-colors">Unlock ledger</button>
            </form>
        </div>
    </div>

    <div id="app-shell" class="hidden min-h-screen flex-col">

                <div class="flex items-center gap-2">
                    <button type="button" id="sign-out" aria-label="Sign out" class="min-h-12 px-3 py-3 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">
                        <i class="fa-solid fa-right-from-bracket sm:mr-1.5"></i><span class="hidden sm:inline">Sign out</span>
                    </button>
                    <button type="button" id="new-entry" class="hidden sm:inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow-sm transition min-h-12">+ New Entry</button>

            </div>
            <p id="sync-note" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 text-sm text-amber-900 bg-amber-50 border-t border-amber-200" role="status"></p>
        </header>

        <div class="sticky top-16 z-30 bg-slate-50/95 backdrop-blur border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                <div id="month-bar" class="flex gap-2 overflow-x-auto" role="tablist" aria-label="Months"></div>
            </div>
        </div>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-28 sm:pb-8 w-full space-y-6 flex-1">
            <div id="kpi-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
                        <div>
                            <h2 class="font-semibold text-slate-900" id="list-title">Transactions</h2>
                            <p class="text-xs text-slate-500" id="list-subtitle"></p>
                        </div>
                        <span id="entry-count" class="text-xs font-semibold px-2.5 py-1 bg-amber-50 text-amber-700 rounded-full">0 items</span>
                    </div>
                    <div id="mobile-ledger" class="sm:hidden divide-y divide-slate-100"></div>
                    <div class="hidden sm:block overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider border-b border-slate-100">
                                <tr>
                                    <th class="px-4 py-3"><button type="button" data-sort="day" class="inline-flex items-center gap-1 hover:text-slate-800 min-h-12">Day <span id="sort-day"></span></button></th>
                                    <th class="px-4 py-3">Description</th>
                                    <th class="px-4 py-3"><button type="button" data-sort="source" class="inline-flex items-center gap-1 hover:text-slate-800 min-h-12">Source <span id="sort-source"></span></button></th>
                                    <th class="px-4 py-3">Status</th>

                                    <th class="px-4 py-3 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ledger-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                    <div id="empty-state" class="hidden p-8 text-center text-sm text-slate-500">No entries for this month.</div>

                    <h3 class="font-semibold text-slate-900 text-sm">Money Split</h3>

            </div>
        </main>

            <i class="fa-solid fa-plus text-xl"></i>

            <span>Entry deleted</span>
            <button type="button" id="undo-delete" class="font-semibold text-amber-300 min-h-12 px-2">Undo</button>
        </div>

        <div id="entry-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm p-0 sm:p-4">

                </div>
                <form id="entry-form" class="p-5 space-y-4">
                    <input type="hidden" id="entry-id">
                    <div>
                        <label for="entry-title" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Description</label>
                        <input type="text" id="entry-title" required class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="entry-type" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Type</label>
                            <select id="entry-type" class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="INCOME">Income (+)</option>
                                <option value="INVESTMENT_OUTFLOW">Investment (-)</option>
                                <option value="FIXED_EXPENSE">Expense (-)</option>
                                <option value="INTERNAL_TRANSFER">Transfer</option>
                            </select>
                        </div>
                        <div>
                            <label for="entry-amount" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Amount (€)</label>
                            <input type="number" id="entry-amount" required min="0.01" step="0.01" class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="entry-date" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Date</label>
                            <input type="date" id="entry-date" required class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                        <div>
                            <label for="entry-category" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Category</label>
                            <select id="entry-category" class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option>Salary</option>
                                <option>ETF</option>
                                <option>Stock</option>
                                <option>Crypto</option>
                                <option>Rent</option>
                                <option>Insurance</option>
                                <option>Subscriptions</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="entry-status" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Status</label>
                        <select id="entry-status" class="w-full min-h-12 px-3 py-3 border border-slate-200 rounded-xl text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option>Scheduled</option>
                            <option>Pending</option>
                            <option>Cleared</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-3 min-h-12 text-sm text-slate-700">
                        <input type="checkbox" id="entry-recurring" class="h-5 w-5 rounded border-slate-300 text-amber-500 focus:ring-amber-500">
                        Recurring every month on this day
                    </label>
                    <div>
                        <p class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Source</p>
                        <div id="source-picker" class="grid grid-cols-1 gap-1.5"></div>
                    </div>
                    <div>
                        <p class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Destination</p>
                        <div id="destination-picker" class="grid grid-cols-1 gap-1.5"></div>
                    </div>
                    <div>
                        <label for="entry-notes" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Notes</label>
                        <textarea id="entry-notes" rows="2" class="w-full px-3 py-3 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" id="cancel-modal" class="min-h-12 px-4 py-3 text-base font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Cancel</button>
                        <button type="submit" class="min-h-12 px-4 py-3 text-base font-semibold text-white bg-amber-500 hover:bg-amber-600 rounded-xl shadow-sm">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

        ];

        function pad(value) {
            return String(value).padStart(2, '0');
        }

        function monthKey(date) {
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
        }

        function monthLabel(key) {
            const [year, month] = key.split('-').map(Number);
            return new Date(year, month - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        }

        function monthTitle(key) {
            const [year, month] = key.split('-').map(Number);
            return new Date(year, month - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        function isoDate(year, month, day) {
            const last = new Date(year, month, 0).getDate();
            return `${year}-${pad(month)}-${pad(Math.min(day, last))}`;
        }

        function formatEuro(amount) {
            const value = Math.abs(Number(amount) || 0);
            return '€' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function signedAmount(item) {
            const value = Math.abs(Number(item.amount) || 0);
            return item.type === 'INCOME' ? value : -value;
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function accountLogo(name, size = 22) {
            const marks = {
                'Commerzbank': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#FFD800"/><path d="M7 21c3.2-7 6.2-9 9-9s5.8 2 9 9" fill="none" stroke="#1c1917" stroke-width="2.4" stroke-linecap="round"/><path d="M9 17.5c2.4 3.4 4.6 4.6 7 4.6s4.6-1.2 7-4.6" fill="none" stroke="#1c1917" stroke-width="2.2" stroke-linecap="round"/></svg>`,
                'Trade Republic': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="16" fill="#000000"/><text x="16" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="Inter, sans-serif">TR</text></svg>`,
                'Scalable Capital': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#00E5B2"/><path d="M13 8H9v16h4M19 8h4v16h-4" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round"/></svg>`,
                'Deutsche Bank': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#0018A8"/><path d="M10 24L22 8" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/></svg>`,
                'DKB': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#005B9A"/><text x="16" y="20.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff" font-family="Inter, sans-serif">DKB</text></svg>`,
                'N26': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#00D09C"/><text x="16" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#042f2e" font-family="Inter, sans-serif">N26</text></svg>`,
                'Other': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#475569"/><path d="M7 14.5 16 8l9 6.5M10 14.5V23h12v-8.5M14 23v-4h4v4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
                'Direct/Other': `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#E2E8F0"/><path d="M9 16h11M16 11l6 5-6 5" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
            };
            return `<span class="inline-flex shrink-0">${marks[name] || marks.Other}</span>`;
        }

        function accountChip(name) {
            return `<span class="inline-flex items-center gap-1.5 pl-1 pr-2 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-700">${accountLogo(name, 18)}<span>${escapeHtml(name)}</span></span>`;
        }

        function createEntry(parts, year, month) {
            const [title, amount, type, sourceBank, destinationBank, category, day, isRecurring] = parts;
            const id = crypto.randomUUID();
            return {
                id,
                seriesId: isRecurring ? `seed-${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}` : '',
                date: isoDate(year, month, day),
                day,
                title,
                type,
                amount: type === 'INCOME' ? amount : -amount,
                sourceBank,
                destinationBank,
                category,
                isRecurring,
                status: 'Cleared',
                notes: ''
            };
        }

        function seedLedger() {
            return SEED.map(parts => createEntry(parts, 2026, 10));
        }

        function readLocal() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                return Array.isArray(parsed) ? parsed.map(normalizeEntry) : [];
            } catch (error) {
                return [];
            }
        }

        function cacheLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
        }

        function toRow(entry) {
            return {
                id: entry.id,
                series_id: entry.seriesId || '',
                date: entry.date,
                day: entry.day,
                title: entry.title,
                type: entry.type,
                amount: entry.amount,
                source_bank: entry.sourceBank,
                destination_bank: entry.destinationBank || '',
                category: entry.category || '',
                is_recurring: Boolean(entry.isRecurring),
                status: entry.status,
                notes: entry.notes || ''
            };
        }

        function fromRow(row) {
            return normalizeEntry({
                id: row.id,
                seriesId: row.series_id,
                date: row.date,
                day: row.day,
                title: row.title,
                type: row.type,
                amount: row.amount,
                sourceBank: row.source_bank,
                destinationBank: row.destination_bank,
                category: row.category,
                isRecurring: row.is_recurring,
                status: row.status,
                notes: row.notes
            });
        }

        function showSyncError(error) {
            const note = document.getElementById('sync-note');
            const missing = error && (error.code === 'PGRST205' || /could not find the table/i.test(error.message || ''));
            note.textContent = missing
                ? 'The cloud ledger is not created yet. Run the entries SQL in the Supabase SQL editor, then reload.'
                : 'Could not sync with Supabase. ' + (error && error.message ? error.message : 'Check your connection.');
            note.classList.remove('hidden');
        }

        function clearSyncError() {
            document.getElementById('sync-note').classList.add('hidden');
        }

        async function upsertEntries(entries) {
            if (!entries.length || !supabaseClient) return;
            const { error } = await supabaseClient.from(TABLE).upsert(entries.map(toRow));
            if (error) showSyncError(error);
            else {
                clearSyncError();
                cacheLocal();
            }
        }

        async function deleteRemote(id) {
            if (!supabaseClient) return;
            const { error } = await supabaseClient.from(TABLE).delete().eq('id', id);
            if (error) showSyncError(error);
            else {
                clearSyncError();
                cacheLocal();
            }
        }

        async function loadLedger() {
            if (!supabaseClient) {
                showSyncError({ message: 'The Supabase library did not load.' });
                transactions = readLocal();
                return;
            }
            const { data, error } = await supabaseClient.from(TABLE).select('*').order('date');
            if (error) {
                showSyncError(error);
                transactions = readLocal();
                return;
            }
            clearSyncError();
            if (!data.length) {
                const local = readLocal();
                transactions = local.length ? local : seedLedger();
                await upsertEntries(transactions);
                return;
            }
            transactions = data.map(fromRow);
            cacheLocal();
        }

        async function refreshFromCloud() {
            if (!supabaseClient || undoEntry) return;
            if (!document.getElementById('entry-modal').classList.contains('hidden')) return;
            if (document.querySelector('#ledger-body input, #mobile-ledger input')) return;
            const { data, error } = await supabaseClient.from(TABLE).select('*').order('date');
            if (error) {
                showSyncError(error);
                return;
            }
            transactions = data.map(fromRow);
            cacheLocal();
            clearSyncError();
            render();
        }

        function watchLedger() {
            if (!supabaseClient || ledgerChannel) return;
            ledgerChannel = supabaseClient.channel('entries-sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => {
                    clearTimeout(reloadTimer);
                    reloadTimer = setTimeout(refreshFromCloud, 400);
                })
                .subscribe();
        }

        function normalizeEntry(item) {
            const type = ['INCOME', 'INVESTMENT_OUTFLOW', 'FIXED_EXPENSE', 'INTERNAL_TRANSFER'].includes(item.type) ? item.type : 'INVESTMENT_OUTFLOW';
            const abs = Math.abs(Number(item.amount) || 0);
            const date = item.date || '2026-10-01';
            return {
                id: String(item.id || crypto.randomUUID()),
                seriesId: item.seriesId || '',
                date,
                day: Number(item.day || date.slice(8, 10)),
                title: item.title || 'Entry',
                type,
                amount: type === 'INCOME' ? abs : -abs,
                sourceBank: item.sourceBank || item.source || 'Commerzbank',
                destinationBank: item.destinationBank || item.destination || '',
                category: item.category || 'ETF',
                isRecurring: Boolean(item.isRecurring),
                status: STATUSES.includes(item.status) ? item.status : 'Cleared',
                notes: item.notes || ''
            };
        }

        async function ensureMonth(key) {
            const [year, month] = key.split('-').map(Number);
            const templates = new Map();
            transactions.filter(item => item.isRecurring && item.seriesId).forEach(item => {
                const current = templates.get(item.seriesId);
                if (!current || item.date < current.date) templates.set(item.seriesId, item);
            });
            const added = [];
            templates.forEach(template => {
                if (key < template.date.slice(0, 7)) return;
                if (transactions.some(item => item.seriesId === template.seriesId && item.date.startsWith(key))) return;
                const day = template.day || Number(template.date.slice(8, 10));
                const date = isoDate(year, month, day);
                const today = new Date();
                const entryDate = new Date(year, month - 1, Number(date.slice(8, 10)));
                const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const copy = {
                    ...template,
                    id: crypto.randomUUID(),
                    date,
                    day: Number(date.slice(8, 10)),
                    status: entryDate < startOfToday ? 'Cleared' : 'Scheduled',
                    isRecurring: true
                };
                transactions.push(copy);
                added.push(copy);
            });
            if (added.length) await upsertEntries(added);
        }

        function monthEntries() {
            return transactions.filter(item => item.date.startsWith(selectedMonth));
        }

        function visibleEntries() {
            const filtered = monthEntries().filter(item => {
                if (activeFilter === 'commerz') return item.sourceBank === 'Commerzbank';
                if (activeFilter === 'brokers') return DIRECT_BROKERS.includes(item.sourceBank);
                return true;
            });
            const dir = sortDir === 'asc' ? 1 : -1;
            return filtered.sort((a, b) => {
                const left = sortKey === 'amount' ? Math.abs(signedAmount(a)) : sortKey === 'source' ? a.sourceBank : a.day;
                const right = sortKey === 'amount' ? Math.abs(signedAmount(b)) : sortKey === 'source' ? b.sourceBank : b.day;
                if (left < right) return -1 * dir;
                if (left > right) return 1 * dir;
                return a.title.localeCompare(b.title);
            });
        }

        function sumMonth(predicate) {
            return monthEntries().filter(predicate).reduce((sum, item) => sum + Math.abs(signedAmount(item)), 0);
        }

        function liquidBalance() {
            return monthEntries().reduce((sum, item) => {
                const value = Math.abs(signedAmount(item));
                if (item.type === 'INTERNAL_TRANSFER') {
                    if (item.sourceBank === 'Commerzbank') return sum - value;
                    if (item.destinationBank === 'Commerzbank') return sum + value;
                    return sum;
                }
                if (item.sourceBank !== 'Commerzbank') return sum;
                return sum + (item.type === 'INCOME' ? value : -value);
            }, 0);
        }

            const current = monthKey(new Date());
            const months = [];
            for (let index = 0; index < 9; index += 1) {

                const classes = selected

                const currentMark = key === current ? '<span class="ml-1 text-[10px] uppercase tracking-wide opacity-80">Current</span>' : '';
                return `<button type="button" data-month="${key}" class="min-h-12 px-4 rounded-full text-sm font-medium whitespace-nowrap ${classes}" role="tab" aria-selected="${selected}">${monthLabel(key)}${currentMark}</button>`;
            }).join('');
            const active = bar.querySelector('[aria-selected="true"]');
            if (active) {
                const left = active.offsetLeft - (bar.clientWidth - active.clientWidth) / 2;
                bar.scrollTo({ left: Math.max(0, left) });

        }

        function renderChart() {
            const income = sumMonth(item => item.type === 'INCOME');
            const invested = sumMonth(item => item.type === 'INVESTMENT_OUTFLOW');
            const expenses = sumMonth(item => item.type === 'FIXED_EXPENSE');
            const slices = [
                { label: 'Income', amount: income, color: '#059669' },
                { label: 'Investment', amount: invested, color: '#d97706' },
                { label: 'Expenses', amount: expenses, color: '#e11d48' }
            ];
            const total = income + invested + expenses;
            const net = income - invested - expenses;
            document.getElementById('chart-legend').innerHTML = slices.map(slice => {
                const share = total ? Math.round((slice.amount / total) * 100) : 0;
                return `<div class="flex items-center justify-between gap-3 text-sm"><span class="inline-flex items-center gap-2 text-slate-700"><span class="w-2.5 h-2.5 rounded-full" style="background:${slice.color}"></span>${slice.label}</span><span class="font-medium text-slate-900">${formatEuro(slice.amount)} <span class="text-xs font-normal text-slate-400">${share}%</span></span></div>`;
            }).join('');
            document.getElementById('chart-center').innerHTML = `<span class="text-[10px] uppercase tracking-wider text-slate-400">Net</span><span class="text-sm font-bold text-slate-900">${formatEuro(net)}</span>`;
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
            if (!total || !window.Chart) return;
            chartInstance = new Chart(document.getElementById('allocationChart'), {
                type: 'doughnut',
                data: {
                    labels: slices.map(slice => slice.label),
                    datasets: [{ data: slices.map(slice => slice.amount), backgroundColor: slices.map(slice => slice.color), borderWidth: 3, borderColor: '#ffffff' }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '68%' }
            });
        }

        function render() {
            renderMonthBar();
            renderFilters();
            renderKpis();
            renderLedger();
            renderChart();
        }

            app.classList.remove('flex');
            login.classList.remove('hidden');

            const modal = document.getElementById('entry-modal');
            document.getElementById('entry-form').reset();
            document.getElementById('modal-title').textContent = item && !asCopy ? 'Edit Entry' : asCopy ? 'Duplicate Entry' : 'New Entry';
            document.getElementById('entry-id').value = item && !asCopy ? item.id : '';
            document.getElementById('entry-title').value = item ? item.title : '';
            document.getElementById('entry-type').value = item ? item.type : 'INVESTMENT_OUTFLOW';
            document.getElementById('entry-amount').value = item ? Math.abs(item.amount) : '';
            document.getElementById('entry-date').value = item && !asCopy ? item.date : (item ? item.date : `${selectedMonth}-01`);
            document.getElementById('entry-category').value = item ? item.category : 'ETF';
            document.getElementById('entry-status').value = item && !asCopy ? item.status : 'Cleared';
            document.getElementById('entry-recurring').checked = item ? item.isRecurring : false;
            document.getElementById('entry-notes').value = item ? item.notes : '';
            formSource = item ? item.sourceBank : 'Commerzbank';
            formDestination = item ? (item.destinationBank || 'Direct/Other') : 'Direct/Other';
            renderPickers();

            modal.classList.add('flex');

        function closeModal() {
            const modal = document.getElementById('entry-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderPickers() {
            const paint = (containerId, selected, options, field) => {
                document.getElementById(containerId).innerHTML = options.map(name => {
                    const active = name === selected;
                    const classes = active ? 'border-amber-500 bg-amber-50 text-amber-950' : 'border-slate-200 text-slate-700 hover:bg-slate-50';
                    return `<button type="button" data-field="${field}" data-account="${escapeHtml(name)}" class="flex w-full min-h-12 items-center gap-2 px-2 py-3 rounded-xl border text-left text-base font-medium ${classes}">${accountLogo(name, 22)}<span>${escapeHtml(name)}</span></button>`;
                }).join('');
            };
            paint('source-picker', formSource, ACCOUNTS, 'source');
            paint('destination-picker', formDestination, DESTINATIONS, 'destination');
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('entry-id').value;
            const type = document.getElementById('entry-type').value;
            const abs = Math.abs(parseFloat(document.getElementById('entry-amount').value));
            const date = document.getElementById('entry-date').value;
            const existing = transactions.find(item => item.id === id);
            const recurring = document.getElementById('entry-recurring').checked;
            const entry = {
                id: id || crypto.randomUUID(),
                seriesId: recurring ? (existing && existing.seriesId ? existing.seriesId : crypto.randomUUID()) : '',
                date,
                day: Number(date.slice(8, 10)),
                title: document.getElementById('entry-title').value.trim(),
                type,
                amount: type === 'INCOME' ? abs : -abs,
                sourceBank: formSource,
                destinationBank: formDestination,
                category: document.getElementById('entry-category').value,
                isRecurring: recurring,
                status: document.getElementById('entry-status').value,
                notes: document.getElementById('entry-notes').value.trim()
            };
            if (existing) {
                const index = transactions.findIndex(item => item.id === id);
                transactions[index] = entry;
            } else {
                transactions.push(entry);
            }
            selectedMonth = date.slice(0, 7);
            await upsertEntries([entry]);
            await ensureMonth(selectedMonth);
            closeModal();
            render();
        }

        async function cycleStatus(id) {
            const item = transactions.find(entry => entry.id === id);
            if (!item) return;
            item.status = STATUSES[(STATUSES.indexOf(item.status) + 1) % STATUSES.length];
            render();
            await upsertEntries([item]);
        }

        async function commitPendingDelete() {
            if (!undoEntry) return;
            const id = undoEntry.item.id;
            clearTimeout(undoTimer);
            undoTimer = null;
            undoEntry = null;
            const toast = document.getElementById('undo-toast');
            toast.classList.add('hidden');
            toast.classList.remove('flex');
            await deleteRemote(id);
        }

        async function deleteEntry(id) {
            if (undoEntry) await commitPendingDelete();
            const index = transactions.findIndex(item => item.id === id);
            if (index < 0) return;
            undoEntry = { index, item: transactions[index] };
            transactions.splice(index, 1);
            render();
            const toast = document.getElementById('undo-toast');
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            undoTimer = setTimeout(() => {
                commitPendingDelete();
            }, 5000);
        }

        function undoDelete() {
            if (!undoEntry) return;
            clearTimeout(undoTimer);
            undoTimer = null;
            transactions.splice(Math.min(undoEntry.index, transactions.length), 0, undoEntry.item);
            undoEntry = null;
            const toast = document.getElementById('undo-toast');
            toast.classList.add('hidden');
            toast.classList.remove('flex');
            render();
        }

        function beginAmountEdit(id, host) {
            const item = transactions.find(entry => entry.id === id);
            if (!item || host.querySelector('input')) return;
            host.innerHTML = `<input type="number" min="0.01" step="0.01" value="${Math.abs(item.amount)}" class="w-28 min-h-12 px-2 py-2 border border-amber-300 rounded-xl text-base text-right" aria-label="Amount">`;
            const input = host.querySelector('input');
            input.focus();
            input.select();
            const commit = () => {
                if (!input.isConnected) return;
                const amount = Math.abs(parseFloat(input.value));
                if (amount > 0) {
                    item.amount = item.type === 'INCOME' ? amount : -amount;
                    upsertEntries([item]).then(() => render());
                } else {
                    renderLedger();
                }
            };
            input.addEventListener('keydown', event => {
                if (event.key === 'Enter') commit();
                if (event.key === 'Escape') renderLedger();
            });
            input.addEventListener('blur', commit);
        }

        function handleLedgerClick(event) {
            const action = event.target.closest('[data-action]');
            if (!action) return;
            const id = action.dataset.id;
            if (action.dataset.action === 'edit') openModal(transactions.find(item => item.id === id), false);
            if (action.dataset.action === 'duplicate') openModal(transactions.find(item => item.id === id), true);
            if (action.dataset.action === 'delete') deleteEntry(id);
            if (action.dataset.action === 'status') cycleStatus(id);
        }

        async function enterApp() {
            showApp();
            document.getElementById('list-title').textContent = 'Loading…';
            await loadLedger();
            await ensureMonth(selectedMonth);
            watchLedger();
            render();
        }

        document.getElementById('login-form').addEventListener('submit', event => {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const error = document.getElementById('login-error');
            if (username !== AUTH_USER || password !== AUTH_PASSWORD) {
                error.textContent = 'That username or password is incorrect.';
                error.classList.remove('hidden');
                document.getElementById('login-password').value = '';
                return;
            }
            error.classList.add('hidden');
            localStorage.setItem(AUTH_KEY, 'true');
            document.getElementById('login-password').value = '';
            enterApp();
        });

        document.getElementById('sign-out').addEventListener('click', async () => {
            await commitPendingDelete();
            if (ledgerChannel && supabaseClient) {
                supabaseClient.removeChannel(ledgerChannel);
                ledgerChannel = null;
            }
            localStorage.removeItem(AUTH_KEY);
            showLogin();
        });

        document.getElementById('month-bar').addEventListener('click', async event => {
            const button = event.target.closest('[data-month]');
            if (!button) return;
            selectedMonth = button.dataset.month;
            await ensureMonth(selectedMonth);
            render();
        });

        document.getElementById('filter-tabs').addEventListener('click', event => {
            const button = event.target.closest('[data-filter]');
            if (!button) return;
            activeFilter = button.dataset.filter;
            render();
        });

        document.querySelectorAll('[data-sort]').forEach(button => {
            button.addEventListener('click', () => {
                const key = button.dataset.sort;
                if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                else {
                    sortKey = key;
                    sortDir = key === 'source' ? 'asc' : key === 'amount' ? 'desc' : 'asc';
                }
                renderLedger();
            });
        });

        document.getElementById('ledger-body').addEventListener('click', handleLedgerClick);
        document.getElementById('mobile-ledger').addEventListener('click', handleLedgerClick);
        document.getElementById('ledger-body').addEventListener('dblclick', event => {
            const cell = event.target.closest('[data-action="amount"]');
            if (cell) beginAmountEdit(cell.dataset.id, cell);
        });
        document.getElementById('mobile-ledger').addEventListener('dblclick', event => {
            const cell = event.target.closest('[data-action="amount"]');
            if (cell) beginAmountEdit(cell.dataset.id, cell);
        });
        document.getElementById('new-entry').addEventListener('click', () => openModal(null, false));
        document.getElementById('fab-entry').addEventListener('click', () => openModal(null, false));
        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('cancel-modal').addEventListener('click', closeModal);
        document.getElementById('entry-form').addEventListener('submit', handleSubmit);
        document.getElementById('undo-delete').addEventListener('click', undoDelete);
        document.getElementById('entry-modal').addEventListener('click', event => {
            const button = event.target.closest('[data-account]');
            if (!button) return;
            if (button.dataset.field === 'source') formSource = button.dataset.account;
            else formDestination = button.dataset.account;
            renderPickers();
        });

        if (localStorage.getItem(AUTH_KEY) === 'true') enterApp();
    </script>
</body>
</html>
