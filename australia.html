<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Australia trip</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1c1917;
            --muted: #78716c;
            --line: #e7e5e4;
            --paper: #fafaf9;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--white);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.4;
        }

        main {
            max-width: 920px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: -0.03em;
        }

        header p,
        #countdown {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .shares {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 28px 0 8px;
        }

        .shares article {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            background: var(--paper);
        }

        .who-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .shares .who-label {
            color: var(--muted);
            font-size: 13px;
        }

        .shares strong {
            display: block;
            margin-top: 4px;
            font-size: 22px;
            letter-spacing: -0.02em;
        }

        .shares em {
            display: block;
            margin-top: 4px;
            font-style: normal;
            font-size: 12px;
            font-weight: 500;
            color: #44403c;
        }

        .booked-total {
            margin: 12px 0 0;
            font-size: 14px;
        }

        .booked-total strong { font-size: 16px; }

        .note {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .table-wrap {
            margin-top: 28px;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
            font-size: 14px;
        }

        th, td {
            padding: 12px 14px;
            text-align: right;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        th:first-child,
        td:first-child,
        th:nth-child(2),
        td:nth-child(2) {
            text-align: left;
        }

        th:nth-child(2),
        td:nth-child(2) {
            white-space: normal;
        }

        thead th {
            background: var(--paper);
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        tbody tr:last-child td { border-bottom: 0; }

        .item-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        tr.open td { color: var(--muted); }
        tr.open .item-label { font-weight: 500; }

        tfoot td {
            background: var(--paper);
            font-weight: 700;
            border-bottom: 0;
            border-top: 1px solid var(--line);
        }

        .status { font-weight: 500; }

        .phone-list {
            display: none;
            list-style: none;
            margin: 24px 0 0;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .phone-list li {
            padding: 16px;
            border-bottom: 1px solid var(--line);
        }

        .phone-list li:last-child { border-bottom: 0; }

        .phone-hint { display: none; }

        .phone-list summary {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2px 12px;
            align-items: center;
            min-height: 48px;
            cursor: pointer;
            list-style: none;
        }

        .phone-list summary::-webkit-details-marker { display: none; }
        .phone-list summary::marker { content: ""; }

        .phone-list .item-label {
            font-size: 18px;
            line-height: 1.3;
            white-space: normal;
        }

        .phone-list .price-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .phone-list .chevron {
            color: #44403c;
            transition: transform 0.15s ease;
        }

        .phone-list details[open] .chevron { transform: rotate(180deg); }

        .phone-list .when {
            grid-column: 1 / -1;
            margin: 0;
            color: #44403c;
            font-size: 15px;
        }

        .phone-list .who {
            display: grid;
            gap: 0;
        }

        .phone-list .who span {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 40px;
            padding-top: 8px;
            margin-top: 8px;
            border-top: 1px solid var(--line);
            font-size: 17px;
            font-weight: 700;
        }

        .phone-list .who em {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-style: normal;
            font-weight: 600;
            font-size: 16px;
            color: #44403c;
        }

        .phone-list li.open,
        .phone-list li.open .item-label { color: #57534e; font-weight: 600; }

        .phone-list li.total { background: var(--paper); }

        .kind-totals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .kind-totals article {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .kind-totals span {
            display: block;
            color: var(--muted);
            font-size: 13px;
        }

        .kind-totals strong {
            display: block;
            margin-top: 4px;
            font-size: 20px;
            letter-spacing: -0.02em;
        }

        .calendar, .group, .checklist { margin-top: 28px; }

        .calendar h2, .group h2, .checklist h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .group h2 {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .legend {
            display: flex;
            gap: 16px;
            margin: 0 0 4px;
            color: #44403c;
            font-size: 13px;
        }

        .legend i {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 50%;
            vertical-align: middle;
        }

        .legend .flight { background: #1c1917; }
        .legend .hotel { background: #78716c; }

        .month { margin-top: 14px; }
        .month h3 { margin: 0 0 6px; font-size: 14px; }

        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .dow, .day { text-align: center; font-size: 11px; }
        .dow { color: #78716c; padding-bottom: 2px; }

        .day {
            min-height: 34px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #a8a29e;
        }

        .day.in { color: var(--ink); background: var(--paper); }

        .dots { display: flex; gap: 2px; height: 6px; }
        .dots b { width: 5px; height: 5px; border-radius: 50%; }
        .dots b.flight { background: #1c1917; }
        .dots b.hotel { background: #78716c; }

        .group .table-wrap, .group .phone-list { margin-top: 0; }

        .checklist { margin-top: 28px; }

        .checklist h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .checklist ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .checklist li {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
            font-size: 16px;
        }

        .checklist li:last-child { border-bottom: 0; }

        .checklist li.done { font-weight: 600; }

        .checklist li:not(.done) { color: #57534e; }

        .check {
            width: 18px;
            height: 18px;
            border: 1.7px solid currentColor;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }

        .checklist li.done .check { background: var(--ink); color: var(--white); border-color: var(--ink); }

        svg { display: block; flex: none; }
        .shares svg { width: 22px; height: 22px; }

        @media (max-width: 900px) {
            body { font-size: 16px; }
            main {
                padding: 20px 16px 56px;
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            header h1 { font-size: 30px; }
            header p, #countdown, .note { font-size: 15px; color: #44403c; }
            .phone-hint { display: block; }
            .shares { grid-template-columns: 1fr; gap: 8px; }
            .shares article {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 4px 12px;
                padding: 14px 16px;
            }
            .shares .who-label { flex: 1; font-size: 16px; }
            .shares strong { margin-top: 0; font-size: 22px; }
            .shares em { flex: 1 0 100%; margin-top: 2px; font-size: 13px; }
            .booked-total { font-size: 16px; }
            .booked-total strong { font-size: 18px; }
            .table-wrap { display: none; }
            .phone-list { display: block; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Australia</h1>
            <p>27 November 2026 – 8 January 2027</p>
            <p id="countdown"></p>
        </header>

        <section class="shares" id="shares" aria-label="Amount left per person"></section>
        <p class="booked-total" id="booked-total"></p>
        <p class="note" id="paid-note"></p>
        <p class="note">Shared costs are split equally. Items that are not booked yet are listed below and are not included above.</p>

        <section class="kind-totals" id="kind-totals" aria-label="Flight and hotel totals"></section>
        <section class="calendar" id="calendar" aria-label="Trip calendar"></section>
        <div id="groups"></div>
        <p class="note">Manila to Brisbane is split three ways. The extra cent is on Lola so the shares add up to €1,345.00.</p>

        <section class="checklist" aria-label="Travel insurance">
            <h2>Travel insurance</h2>
            <ul>
                <li class="done"><span class="check" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>Me</li>
                <li><span class="check" aria-hidden="true"></span>Mom</li>
                <li class="done"><span class="check" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>Lola</li>
            </ul>
        </section>

    </main>

    <script>
        const PEOPLE = ['Me', 'Mom', 'Lola'];
        const PAID = { Me: 0, Mom: 83472, Lola: 0 };

        const ITEMS = [
            { item: 'London → Berlin', when: 'Departs 27 Nov, returns 8 Jan', total: 234.47, who: ['Mom'], status: 'Booked', kind: 'flight', start: '2026-11-27', end: '2027-01-08' },
            { item: 'Berlin ↔ Manila', when: 'Departs 27 Nov, returns 7 Jan', total: 2808.56, who: ['Me', 'Mom'], status: 'Booked', kind: 'flight', start: '2026-11-27', end: '2027-01-07' },
            { item: 'Manila → Brisbane', when: '30 Nov', total: 1345, who: ['Me', 'Mom', 'Lola'], status: 'Booked', kind: 'flight', start: '2026-11-30' },
            { item: 'Melbourne → Manila', when: 'Date not set', total: 2407.53, who: ['Me', 'Mom', 'Lola'], status: 'Booked', kind: 'flight' },
            { item: 'Hotel, Manila', when: '28–29 Nov', total: null, who: [], status: 'Booked', kind: 'hotel', start: '2026-11-28', end: '2026-11-29' },
            { item: 'Hotel, Manila', when: '29–30 Nov', total: 0, who: [], status: 'Free, Sir Sam', kind: 'hotel', start: '2026-11-29', end: '2026-11-30' },
            { item: 'Hotel, Brisbane', when: '30 Nov – 1 Dec', total: null, who: [], status: 'Not booked', kind: 'hotel', start: '2026-11-30', end: '2026-12-01' },
            { item: 'Hotel', when: '15–20 Dec', total: null, who: [], status: 'Booked', kind: 'hotel', start: '2026-12-15', end: '2026-12-20' }
        ];

        let totals = { Me: 0, Mom: 0, Lola: 0, all: 0 };
        let rows = [];

        function icon(name) {
            const box = 'viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"';
            const people = {
                Me: '<circle cx="12" cy="7.4" r="3.2"/><path d="M5.1 20.2c1-3.7 3.5-5.4 6.9-5.4s5.9 1.7 6.9 5.4c.2.6-.3 1.1-.9 1.1H6c-.6 0-1.1-.5-.9-1.1z"/>',
                Mom: '<path d="M6.4 10.4C6.8 5.6 8.8 3.6 12 3.6s5.2 2 5.6 6.8c-1.5-1.6-3.4-2.4-5.6-2.4s-4.1.8-5.6 2.4z"/><circle cx="12" cy="9.2" r="2.8"/><path d="M5.3 20.2c.9-3.5 3.3-5.1 6.7-5.1s5.8 1.6 6.7 5.1c.2.6-.3 1.1-.9 1.1H6.2c-.6 0-1.1-.5-.9-1.1z"/>',
                Lola: '<circle cx="12" cy="3.2" r="1.9"/><circle cx="12" cy="8.8" r="3"/><path d="M5.3 20.3c.9-3.5 3.3-5.1 6.7-5.1s5.8 1.6 6.7 5.1c.2.6-.3 1.1-.9 1.1H6.2c-.6 0-1.1-.5-.9-1.1z"/>'
            };
            if (people[name]) {
                return '<svg ' + box + ' fill="currentColor">' + people[name] + '</svg>';
            }
            const strokes = {
                flight: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
                hotel: '<path d="M3 19V9"/><path d="M3 14h18v5"/><path d="M21 19v-5"/><path d="M7 14v-1.2A1.8 1.8 0 0 1 8.8 11h6.4A1.8 1.8 0 0 1 17 12.8V14"/>'
            };
            return '<svg ' + box + ' fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + strokes[name] + '</svg>';
        }

        function personLabel(name) {
            return '<span class="who-label">' + icon(name) + '<span>' + name + '</span></span>';
        }

        function money(amount) {
            return '€' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function split(total, who) {
            const shares = { Me: null, Mom: null, Lola: null };
            if (!who.length || total === null) return shares;
            const cents = Math.round(total * 100);
            const base = Math.floor(cents / who.length);
            const remainder = cents - base * who.length;
            who.forEach(function (name, index) {
                shares[name] = base + (index >= who.length - remainder ? 1 : 0);
            });
            return shares;
        }

        function cell(cents) {
            return cents === null ? '—' : money(cents / 100);
        }

        function peopleCells(shares) {
            return PEOPLE.map(function (name) {
                return '<span><em>' + personLabel(name) + '</em>' + cell(shares[name]) + '</span>';
            }).join('');
        }

        function itemLabel(entry) {
            return '<span class="item-label">' + icon(entry.kind) + '<span>' + escapeHtml(entry.item) + '</span></span>';
        }

        function chevron() {
            return '<svg class="chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
        }

        function phoneDetails(title, meta, price, shares) {
            return '<details><summary>' + title +
                '<span class="price-wrap"><span>' + price + '</span>' + chevron() + '</span>' +
                '<span class="when">' + meta + '</span></summary>' +
                '<div class="who">' + peopleCells(shares) + '</div>' +
                '</details>';
        }

        function render() {
            totals = { Me: 0, Mom: 0, Lola: 0, all: 0 };
            rows = ITEMS.map(function (entry) {
                const shares = split(entry.total, entry.who);
                const open = entry.status === 'Not booked';
                if (!open && entry.total !== null) {
                    totals.all += Math.round(entry.total * 100);
                    PEOPLE.forEach(function (name) {
                        if (shares[name] !== null) totals[name] += shares[name];
                    });
                }
                return { entry: entry, shares: shares, open: open };
            });

            document.getElementById('shares').innerHTML = PEOPLE.map(function (name) {
                const left = totals[name] - PAID[name];
                const detail = PAID[name]
                    ? '<em>Share ' + money(totals[name] / 100) + ', paid ' + money(PAID[name] / 100) + '</em>'
                    : '';
                return '<article>' + personLabel(name) + '<strong>' + money(left / 100) + '</strong>' + detail + '</article>';
            }).join('');

            document.getElementById('booked-total').innerHTML = 'Booked so far <strong>' + money(totals.all / 100) + '</strong>';
            document.getElementById('paid-note').textContent = 'Mom paid ' + money(PAID.Mom / 100) + '. Her number above is what is left of her share.';

            const kinds = [
                { id: 'flight', title: 'Flights', label: 'Flight total' },
                { id: 'hotel', title: 'Hotels', label: 'Hotel total' }
            ];
            const kindSums = {};
            kinds.forEach(function (kind) {
                kindSums[kind.id] = { Me: 0, Mom: 0, Lola: 0, all: 0 };
            });
            rows.forEach(function (row) {
                if (row.open || row.entry.total === null) return;
                const bucket = kindSums[row.entry.kind];
                bucket.all += Math.round(row.entry.total * 100);
                PEOPLE.forEach(function (name) {
                    if (row.shares[name] !== null) bucket[name] += row.shares[name];
                });
            });

            document.getElementById('kind-totals').innerHTML = kinds.map(function (kind) {
                return '<article><span>' + kind.title + '</span><strong>' + money(kindSums[kind.id].all / 100) + '</strong></article>';
            }).join('');

            renderCalendar();

            document.getElementById('groups').innerHTML = kinds.map(function (kind) {
                const list = rows.filter(function (row) { return row.entry.kind === kind.id; }).sort(function (a, b) {
                    const left = a.entry.start || '9999';
                    const right = b.entry.start || '9999';
                    return left < right ? -1 : left > right ? 1 : 0;
                });
                const sums = kindSums[kind.id];
                const hint = kind.id === 'flight' ? '<p class="note phone-hint">Tap a cost to see each person’s share.</p>' : '';
                const extra = kind.id === 'hotel' ? '<p class="note">Booked hotels without a price are listed here and are not added to the total.</p>' : '';
                return '<section class="group"><h2><span>' + kind.title + '</span><span>' + money(sums.all / 100) + '</span></h2>' +
                    hint +
                    '<div class="table-wrap"><table><thead><tr><th>Item</th><th>When</th><th>Total</th>' +
                    PEOPLE.map(function (name) { return '<th>' + personLabel(name) + '</th>'; }).join('') +
                    '<th>Status</th></tr></thead><tbody>' +
                    list.map(function (row) {
                        const entry = row.entry;
                        return '<tr class="' + (row.open ? 'open' : '') + '"><td>' + itemLabel(entry) + '</td><td>' + escapeHtml(entry.when) + '</td><td>' +
                            (entry.total === null ? '—' : money(entry.total)) + '</td><td>' + cell(row.shares.Me) + '</td><td>' + cell(row.shares.Mom) + '</td><td>' + cell(row.shares.Lola) + '</td><td class="status">' + escapeHtml(entry.status) + '</td></tr>';
                    }).join('') +
                    '</tbody><tfoot><tr><td>' + kind.label + '</td><td></td><td>' + money(sums.all / 100) + '</td>' +
                    PEOPLE.map(function (name) { return '<td>' + money(sums[name] / 100) + '</td>'; }).join('') +
                    '<td></td></tr></tfoot></table></div>' +
                    '<ul class="phone-list">' +
                    list.map(function (row) {
                        const entry = row.entry;
                        const price = entry.total === null ? '—' : money(entry.total);
                        return '<li class="' + (row.open ? 'open' : '') + '">' + phoneDetails(itemLabel(entry), escapeHtml(entry.when) + ' · ' + escapeHtml(entry.status), price, row.shares) + '</li>';
                    }).join('') +
                    '<li class="total">' + phoneDetails('<strong>' + kind.label + '</strong>', 'Each person', money(sums.all / 100), sums) + '</li></ul>' + extra + '</section>';
            }).join('');
        }

        function pad(value) {
            return String(value).padStart(2, '0');
        }

        function isoFromDate(date) {
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
        }

        function dateFromIso(iso) {
            const parts = iso.split('-').map(Number);
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function renderCalendar() {
            const marks = {};
            function add(iso, kind) {
                if (!marks[iso]) marks[iso] = {};
                marks[iso][kind] = true;
            }
            ITEMS.forEach(function (entry) {
                if (!entry.start) return;
                if (entry.kind === 'flight') {
                    add(entry.start, 'flight');
                    if (entry.end && entry.end !== entry.start) add(entry.end, 'flight');
                    return;
                }
                const day = dateFromIso(entry.start);
                const last = dateFromIso(entry.end || entry.start);
                while (day <= last) {
                    add(isoFromDate(day), 'hotel');
                    day.setDate(day.getDate() + 1);
                }
            });
            const dows = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            const months = [[2026, 10], [2026, 11], [2027, 0]].map(function (pair) {
                const year = pair[0];
                const month = pair[1];
                const first = new Date(year, month, 1);
                const count = new Date(year, month + 1, 0).getDate();
                let cells = dows.map(function (label) { return '<div class="dow">' + label + '</div>'; }).join('');
                for (let blank = 0; blank < first.getDay(); blank += 1) cells += '<div></div>';
                for (let day = 1; day <= count; day += 1) {
                    const iso = year + '-' + pad(month + 1) + '-' + pad(day);
                    const mark = marks[iso] || {};
                    const inTrip = iso >= '2026-11-27' && iso <= '2027-01-08';
                    const dots = (mark.flight ? '<b class="flight"></b>' : '') + (mark.hotel ? '<b class="hotel"></b>' : '');
                    cells += '<div class="day' + (inTrip || dots ? ' in' : '') + '"><span>' + day + '</span><span class="dots">' + dots + '</span></div>';
                }
                const title = first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                return '<div class="month"><h3>' + title + '</h3><div class="cal">' + cells + '</div></div>';
            }).join('');
            document.getElementById('calendar').innerHTML =
                '<h2>Calendar</h2><p class="legend"><span><i class="flight"></i>Flight day</span><span><i class="hotel"></i>Hotel day</span></p>' +
                '<p class="note">Round trips are shown on the departure day and the return day. Melbourne to Manila is not on the calendar yet.</p>' +
                months;
        }

        function showCountdown() {
            const start = new Date(2026, 10, 27);
            const end = new Date(2027, 0, 8);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const day = 86400000;
            let text = 'Trip finished';
            if (today < start) {
                const days = Math.round((start - today) / day);
                text = days === 1 ? '1 day to go' : days + ' days to go';
            } else if (today.getTime() === start.getTime()) {
                text = 'You fly today';
            } else if (today <= end) {
                text = 'You are on the trip';
            }
            document.getElementById('countdown').textContent = text;
        }

        showCountdown();
        render();
    </script>
</body>
</html>
